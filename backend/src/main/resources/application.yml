# Shared configuration. The dev profile (default) adds demo data; see application-dev.yml.
spring:
  application:
    name: novafer-erp-api
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/novafer}
    username: ${DATABASE_USERNAME:novafer}
    password: ${DATABASE_PASSWORD:novafer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8085}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

novafer:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:12h}
    issuer: novafer-erp
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    # Optional bootstrap admin, created at startup when no account with this email exists.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Administrateur}
  demo:
    enabled: false
    password: ${DEMO_PASSWORD:}
